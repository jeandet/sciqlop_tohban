[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sciqlop-tohban"
version = "0.2.0"
description = "Review and edit BepiColombo/Mio observation plans (.evt) during Tohban meetings"
requires-python = ">=3.10"
dependencies = ["SciQLop>=0.14.0.dev0,<0.15", "numpy"]

[project.entry-points."sciqlop.plugins"]
sciqlop_tohban = "sciqlop_tohban"

[tool.setuptools.packages.find]
include = ["sciqlop_tohban*"]

[tool.setuptools.package-data]
sciqlop_tohban = ["plugin.json", "resources/*.png"]
